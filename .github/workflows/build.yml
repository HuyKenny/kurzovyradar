name: build
# Every 15 min: import the odds (Tipsport + Chance partner API) into the SQLite state, render the site with the local SSR app and
# deploy the changed static files + edge/worker.js (Workers Free: no cron, no D1/KV on Cloudflare). See scripts/static.py.
# PUBLIC repo: logs are public. Scripts print only counts and HTTP statuses; credentials come from secrets (masked by GitHub);
# the state (odds history) is an encrypted release asset (scripts/state.sh).
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick fix: no feed request (render from the saved data) - for CSS/JS/template/text fixes"
        type: boolean
        default: false
      all:
        description: "Re-render every match page (default: only changed ones)"
        type: boolean
        default: false
concurrency:
  group: build
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write          # release asset with the encrypted state
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Cost guard - the repo must stay public (private repos burn the shared 2 000 free minutes)"
        run: |
          [ "$(gh api repos/${{ github.repository }} --jq .private)" = "false" ] || { echo "repo is private - stopping to protect free minutes"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build cache (the Astro build only changes with the code)
        id: dist
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}
      - name: Test + build
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          pnpm exec vitest run
          pnpm build
        env:
          KR_BUILD: ${{ github.sha }}
      - name: Restore state (encrypted)
        run: scripts/state.sh pull
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Import + render + deploy
        run: python3 scripts/static.py run ${{ (github.event_name == 'workflow_dispatch' && inputs.quick) && '--no-import' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && '--all' || '' }}
        env:
          KR_BUILD: ${{ github.sha }}
          TIPSPORT_CLIENT_ID: ${{ secrets.TIPSPORT_CLIENT_ID }}
          TIPSPORT_CLIENT_SECRET: ${{ secrets.TIPSPORT_CLIENT_SECRET }}
          CHANCE_API_USER: ${{ secrets.CHANCE_API_USER }}
          CHANCE_API_PASS: ${{ secrets.CHANCE_API_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Secret check of repo + build output
        if: always()
        run: python3 scripts/verify_no_secrets.py
        env:
          TIPSPORT_CLIENT_ID: ${{ secrets.TIPSPORT_CLIENT_ID }}
          TIPSPORT_CLIENT_SECRET: ${{ secrets.TIPSPORT_CLIENT_SECRET }}
          CHANCE_API_USER: ${{ secrets.CHANCE_API_USER }}
          CHANCE_API_PASS: ${{ secrets.CHANCE_API_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: Save state (encrypted)
        if: always()
        run: scripts/state.sh push
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
